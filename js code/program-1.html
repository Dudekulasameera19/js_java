<!DOCTYPE html>
<html>

<head>
    <title>Demo</title>
</head>

<body>

    <h1 id="output"></h1>
    <p id="result"></p>

    <script>
        let message = "Hello guys";

        document.getElementById("result").innerHTML = "Sum is: " + sum;
    </script>
